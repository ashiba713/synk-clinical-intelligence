name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU torch + dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Smoke pipeline (generate + tiny train)
        run: |
          python -m scripts.cli generate-data --n-patients 12 --seed 7
          python -m scripts.cli train --set synthetic.n_patients=12 --set training.max_epochs=1 --skip-training

      - name: Run test suite
        env:
          SYNK_SYNTHETIC__OUTPUT_DIR: data/synthetic
        run: pytest tests/ -q --tb=short

      - name: API smoke
        run: |
          python -m uvicorn synk.api.main:create_app --factory --port 8000 &
          sleep 20
          curl -fs http://localhost:8000/health
          curl -fs "http://localhost:8000/api/v1/patients?limit=2" > /dev/null

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t synk:ci .
