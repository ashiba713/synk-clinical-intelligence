[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synk"
version = "0.1.0"
description = "SYNK - Explainable multimodal AI for early sepsis risk stratification (research prototype)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SYNK Research" }]
keywords = ["sepsis", "multimodal", "clinical-ai", "explainability", "icu"]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "sqlalchemy>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "torch>=2.1",
    "pytorch-lightning>=2.1",
    "pytorch-forecasting>=1.1",
    "scikit-learn>=1.3",
    "transformers>=4.40",
    "tokenizers>=0.19",
    "datasets>=2.18",
    "accelerate>=0.27",
    "shap>=0.44",
    "captum>=0.7",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "mlflow>=2.10",
    "streamlit>=1.32",
    "httpx>=0.27",
    "tqdm>=4.66",
    "reportlab>=4.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
wandb = ["wandb>=0.16"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.3",
]

[project.scripts]
synk-generate-synthetic = "synk.scripts_stub:noop"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501", "N806", "N803", "UP035", "UP006", "UP007", "UP045"]

[tool.coverage.run]
source = ["src/synk"]
omit = ["*/tests/*"]
